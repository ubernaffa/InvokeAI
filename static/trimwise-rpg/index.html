<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trimwise Retro RPG</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <h1>Trimwise: Gym Quest</h1>
        <p>Retro single-level isometric RPG. Train every station and complete your workout.</p>
      </header>
      <canvas id="game" width="960" height="600" aria-label="Trimwise retro gym game"></canvas>
      <section class="hud">
        <p><strong>Move:</strong> WASD / Arrow Keys &nbsp; <strong>Sprint:</strong> Shift</p>
        <p><strong>Action:</strong> Space near a station &nbsp; <strong>Goal:</strong> Complete all 4 stations</p>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
